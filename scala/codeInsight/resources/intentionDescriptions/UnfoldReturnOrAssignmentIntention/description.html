<body>
<p>Converts a <b>return</b> or an assignment whose value is an <b>if</b>, <b>match</b> or <b>try</b> expression
    into that expression, with each branch ending in its own <b>return</b> or assignment.</p>
<p>Value definitions such as <code>val x = if (c) a else b</code> are not assignments and are not converted.</p>
</body>
